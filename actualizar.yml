name: Actualizar Panel Bursatil

on:
  schedule:
    - cron: '0 9 * * *'  # Se ejecuta todos los días a las 9:00 AM UTC
  workflow_dispatch:      # Te permite presionarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install yfinance pandas numpy

      - name: Ejecutar script de acciones
        run: python app.py

      - name: Guardar y publicar cambios en la web
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Actualización automática del panel de acciones"
          file_pattern: index.html